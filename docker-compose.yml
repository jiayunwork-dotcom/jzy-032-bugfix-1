services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dag
      POSTGRES_PASSWORD: dag
      POSTGRES_DB: dag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dag -d dag"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dag:dag@db:5432/dag
      TICK_INTERVAL: "0.1"
      SCHEDULER_ENABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
